# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
# Compiled against (and therefore requires) Loader 0.19.5: 0.19.3, 0.19.4 and 0.19.5 ship a byte-identical
# net.fabricmc.loader.impl.lib.tinyremapper / mappingio API and an unchanged GameTransformer.patchedClasses
# field, so the built jar runs on any of them.
loader_version=0.19.5
# Mod Properties
mod_version=1.0.0+mc1.21.11
maven_group=kynarain.cn
archives_base_name=OptiFabric
# Dependencies
# ASM version to compile against; at runtime the version shipped with Fabric Loader's launch libraries is used.
# Only APIs present since ASM 9.6 are used, so a newer compile-time version is safe.
asm_version=9.10.1
