plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

// The 1.21.x line. Every release here is obfuscated, so each needs its own official -> intermediary mappings
// bundled into the jar (the obfuscated names differ per version, so a wrongly built jar would remap OptiFine
// into nonsense) - which is why one jar is always built for exactly one release. The fixers in
// common/src/main/java/.../patcher/fixes are written against intermediary ids, which are stable across the
// 1.21.x releases, so the same sources serve all of them.
//
// The default release comes from this project's gradle.properties and -Pmc=<version> builds another one:
//
//   .\gradlew -p v1.21.x build "-Pmc=1.21.8"
//
// The 26.x line is a separate project next door (v26.x) because 26.1 and newer ship unobfuscated, which is a
// different Loom flavour and a different naming of the game - see docs/PORT_26.x.md.
def targetMc = (project.findProperty("mc") ?: project.minecraft_version).toString()

// Yarn is published per release and its build number is part of the version string, so the supported releases
// are listed here (latest yarn build of each). Adding a release is one line.
def yarnBuilds = [
        "1.21"    : "1.21+build.9",
        "1.21.1"  : "1.21.1+build.3",
        "1.21.3"  : "1.21.3+build.2",
        "1.21.4"  : "1.21.4+build.8",
        "1.21.6"  : "1.21.6+build.1",
        "1.21.7"  : "1.21.7+build.8",
        "1.21.8"  : "1.21.8+build.1",
        "1.21.9"  : "1.21.9+build.1",
        "1.21.10" : "1.21.10+build.3",
        "1.21.11" : "1.21.11+build.6",
]

def targetYarn = yarnBuilds[targetMc]

if (targetYarn == null) {
    throw new GradleException("No yarn build is listed for Minecraft " + targetMc + "; add it to yarnBuilds in v1.21.x/build.gradle")
}

version = "${project.mod_version_base}+mc${targetMc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom already adds the repositories needed for Minecraft, Fabric Loader and the mapping artifacts.
}

configurations {
    // OptiFine is remapped from the official (obfuscated) namespace to intermediary at runtime, so the
    // intermediary mappings have to be available inside the built jar. Upstream OptiFabric did the same.
    intermediaryMappings
}

// Everything that is not version specific lives in common/ and is compiled into this project as well.
def sharedSources = file('../common/src/main')

sourceSets {
    main {
        java.srcDirs = [new File(sharedSources, 'java'), file('src/main/java')]
        resources.srcDirs = [new File(sharedSources, 'resources'), file('src/main/resources')]
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMc}"
    mappings "net.fabricmc:yarn:${targetYarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    intermediaryMappings "net.fabricmc:intermediary:${targetMc}:v2"

    // All of these are provided at runtime by Fabric Loader / its launch libraries:
    // ASM and Mixin are launch libraries, and tiny-remapper + mapping-io are shaded inside the loader jar
    // (net.fabricmc.loader.impl.lib.tinyremapper / ...mappingio). Nothing is bundled into this mod.
    compileOnly "org.ow2.asm:asm:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-tree:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-commons:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-analysis:${project.asm_version}"
}

def targetJavaVersion = 21
def mixinCompatibilityLevel = "JAVA_" + targetJavaVersion

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", targetMc
    inputs.property "loader_version", project.loader_version
    inputs.property "mixin_compatibility_level", mixinCompatibilityLevel
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": targetMc,
                "loader_version": project.loader_version
    }

    // The shared config carries a placeholder: Mixin refuses to apply a mixin class compiled for a newer Java
    // version than its config declares, so this line has to follow the compile release of the project.
    filesMatching("optifabric.mixins.json") {
        expand "mixin_compatibility_level": mixinCompatibilityLevel
    }

    // Bundle the official -> intermediary mappings taken from the intermediary artifact
    from({ zipTree(configurations.intermediaryMappings.singleFile) }) {
        include "mappings/mappings.tiny"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from(file('../LICENSE.txt')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named("build") {
    doFirst {
        println "Building ${project.archives_base_name} ${project.version} (Minecraft ${targetMc}, yarn ${targetYarn}," +
                " Fabric Loader ${project.loader_version})"
    }
}
