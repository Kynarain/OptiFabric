# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# The 1.21.x project. Which release is built by default; -Pmc=<version> builds any other release listed in
# build.gradle's yarnBuilds table, e.g.
#   .\gradlew -p v1.21.x build "-Pmc=1.21.8"
# (The quotes matter in PowerShell: without them 1.21.8 is split into 1 and .21.8, and Gradle then reports
# "No yarn build is listed for Minecraft 1".)
minecraft_version=1.21.11
# Compiled against (and therefore requires) Loader 0.19.5: 0.19.3, 0.19.4 and 0.19.5 ship a byte-identical
# net.fabricmc.loader.impl.lib.tinyremapper / mappingio API and an unchanged GameTransformer.patchedClasses
# field, so the built jar runs on any of them.
loader_version=0.19.5
# Mod Properties
# The jar's version is "<mod_version_base>+mc<minecraft version>", so this project produces
# OptiFabric-1.1.0+mc1.21.10.jar and friends.
mod_version_base=1.1.0
maven_group=kynarain.cn
archives_base_name=OptiFabric
# Dependencies
# ASM version to compile against; at runtime the version shipped with Fabric Loader's launch libraries is used.
# Only APIs present since ASM 9.6 are used, so a newer compile-time version is safe.
asm_version=9.10.1
