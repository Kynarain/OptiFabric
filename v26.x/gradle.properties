# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# The 26.x project. Minecraft 26.1 and newer is unobfuscated, so this project takes no mappings at all and
# needs Loom's non-remapping flavour (net.fabricmc.fabric-loom, see build.gradle). Unlike v1.21.x there is no
# -Pmc here: the target release of this project is simply the value below.
minecraft_version=26.1.2
# Compiled against (and therefore requires) Loader 0.19.5.
loader_version=0.19.5
# Mod Properties
# The jar's version is "<mod_version_base>+mc<minecraft version>".
# 1.2.x: the 26.x line is versioned on its own, because 1.1.0 was already published for 1.21.x (those jars stay
# 1.1.0+mc1.21.x - a version number is frozen once its files are out). 1.2.0 was built during development but
# never released, so the first 26.x release is 1.2.1.
mod_version_base=1.2.1
maven_group=kynarain.cn
# The artifact keeps the line's name too, so a jar in mods/ is recognisable as the 26.x one and matches the id
# inside its fabric.mod.json (see build.gradle for why that id is not "optifabric").
archives_base_name=OptiFabric-Reforged
# Dependencies
# ASM version to compile against; at runtime the version shipped with Fabric Loader's launch libraries is used.
# Only APIs present since ASM 9.6 are used, so a newer compile-time version is safe.
asm_version=9.10.1
